<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Directional radar sweep</title><desc id="desc">A schematic with friendly, hostile, and unknown targets around a radar. This illustrates the detection logic rather than an application screenshot.</desc><rect width="1280" height="720" fill="#202d2c"/><g transform="translate(640 360)" fill="none" stroke="#65817b" stroke-width="1.5" opacity=".5"><circle r="75"/><circle r="150"/><circle r="225"/><circle r="300"/><path d="M-335 0H335M0-335V335M-237-237L237 237M-237 237L237-237"/></g><path d="M640 360L790 100A300 300 0 0 1 940 360Z" fill="#8ab3a1" opacity=".15"/><path d="M640 360L899.8 210" stroke="#b1d3b7" stroke-width="3"/><g fill="#bdd2c2"><circle cx="640" cy="360" r="5"/><circle cx="520" cy="230" r="7"/><circle cx="780" cy="450" r="7"/></g><g fill="#c68887"><circle cx="811" cy="263" r="8"/><circle cx="412" cy="438" r="7"/></g><path d="M719 139l8 14-8 14-8-14z" fill="#d3c69f"/><g fill="#c7d5d1" font-family="Arial,sans-serif" font-size="15" letter-spacing="2"><text x="37" y="46">RADAR / DIRECTIONAL DETECTION</text><text x="37" y="682" opacity=".65" font-size="12">SYSTEM SCHEMATIC</text></g><g font-family="Arial,sans-serif" font-size="12"><circle cx="977" cy="650" r="4" fill="#bdd2c2"/><text x="989" y="654" fill="#c7d5d1">Friendly</text><circle cx="1080" cy="650" r="4" fill="#c68887"/><text x="1092" y="654" fill="#c7d5d1">Hostile</text><circle cx="1170" cy="650" r="4" fill="#d3c69f"/><text x="1182" y="654" fill="#c7d5d1">Unknown</text></g></svg>

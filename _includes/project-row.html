<article class="project-row{% unless include.project.image %} no-thumbnail{% endunless %}">
  {% if include.project.image %}
  <a class="project-thumbnail" href="{{ include.project.url | relative_url }}" tabindex="-1" aria-hidden="true">
    <img src="{{ include.project.image | relative_url }}" alt="" loading="lazy"{% if include.project.image_width and include.project.image_height %} width="{{ include.project.image_width }}" height="{{ include.project.image_height }}"{% endif %}>
  </a>
  {% endif %}
  <div class="project-summary">
    <h3><a href="{{ include.project.url | relative_url }}">{{ include.project.title }}</a></h3>
    <p>{{ include.project.short_description }}</p>
    {% if include.project.status %}<p class="project-status">{{ include.project.status }}</p>{% endif %}
    <p class="project-tools">{{ include.project.tools }}</p>
  </div>
</article>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#1c1d20">
  <meta name="color-scheme" content="dark light">
  <script src="{{ '/assets/theme-init.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/profile.jpg' | absolute_url }}">
  <meta property="og:image:alt" content="Portrait of Pelinsu Kaleli">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Pelinsu Kaleli home">Pelinsu Kaleli</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#research' | relative_url }}">Research</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/#experience' | relative_url }}"{% if page.layout == 'experience' %} aria-current="location"{% endif %}>Experience</a>
      </nav>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="true" aria-label="Switch to light mode" hidden>Light mode</button>
    </div>
  </header>
  <main id="main" class="site-main">{{ content }}</main>
  <footer class="site-footer">
    <div class="footer-inner"><span>© {{ 'now' | date: '%Y' }} Pelinsu Kaleli</span><a href="https://github.com/xNgardy/xngardy.github.io">Website source</a></div>
  </footer>
</body>
</html>
